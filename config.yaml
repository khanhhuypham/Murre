# =============================================================================
# config.yaml — Cấu hình encoder SGPT và LLM của MURRE
# =============================================================================

# -----------------------------------------------------------------------------
# CẤU HÌNH MÔ HÌNH ENCODER (SGPT)
# -----------------------------------------------------------------------------
encoder:
    # Tên model HuggingFace — tự động tải về lần đầu tiên. ĐÂY là thứ DUY NHẤT
    # quyết định dùng SGPT cỡ nào, đổi model chỉ cần sửa đúng dòng này.
    # Các lựa chọn theo thứ tự tăng dần về chất lượng/RAM:
    #   "Muennighoff/SGPT-125M-weightedmean-msmarco-specb-bitfit"  (~500MB)
    #   "Muennighoff/SGPT-1.3B-weightedmean-msmarco-specb-bitfit"  (~5GB)
    #   "Muennighoff/SGPT-2.7B-weightedmean-msmarco-specb-bitfit"  (~11GB)
    #   "Muennighoff/SGPT-5.8B-weightedmean-msmarco-specb-bitfit"  (~23GB)
    # Nhãn thư mục outputs/ suy ra từ chính tên này (SGPT-125M-weightedmean-... →
    # sgpt-125m-weightedmean-...), nên kết quả của hai model không ghi đè nhau và
    # cũng không có biến nào phải sửa kèm.
    model_name: Muennighoff/SGPT-125M-weightedmean-msmarco-specb-bitfit

    # Số lượng văn bản xử lý song song — giảm nếu gặp lỗi hết RAM
    batch_size: 256

# -----------------------------------------------------------------------------
# CẤU HÌNH LLM (dùng cho bước Rewrite và sinh SQL)
# -----------------------------------------------------------------------------
llm:
    # Tên model. Ví dụ:
    #   OpenAI:  gpt-3.5-turbo, gpt-4o-mini, gpt-4o
    #   Groq:    llama-3.1-8b-instant
    #   Ollama:  qwen2.5:7b, qwen2.5:14b, qwen2.5-coder:7b, llama3.2, ...
    active_profile: qwen2.5-0.5b
    # Khai báo sẵn nhiều "profile" LLM, mỗi profile là 1 model/endpoint riêng.
    # Thêm profile mới bằng cách copy 1 khối dưới đây và đổi tên/model_name.

    profiles:

        # Mỗi profile còn 3 khóa tùy chọn (mặc định trong src/config.py):
        #   connect_timeout: 3.0   giây chờ MỞ kết nối — Ollama chưa bật thì lỗi ngay
        #   timeout:         120.0 giây chờ MỘT lần sinh — model lớn cần tăng
        #   max_retries:     1     số lần thử lại khi request lỗi
        qwen2.5-7b:
            model_name: qwen2.5:7b
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0
            connect_timeout: 3.0
            timeout: 120.0
            max_retries: 1

        qwen2.5-14b:
            model_name: qwen2.5:14b
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0

        qwen2.5-coder-7b:
            model_name: qwen2.5-coder:7b
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0

        qwen2.5-0.5b:
            model_name: qwen2.5:0.5b
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0

        smollm2-135m:
            model_name: smollm2:135m
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0

        llama3.2-1b:
            model_name: llama3.2:1b
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0

        llama3.2:
            model_name: llama3.2:3b
            api_key: ""
            base_url: "http://localhost:11434/v1"
            temperature: 0.0

        openai-gpt-3.5-turbo:
            model_name: gpt-3.5-turbo    # Model dùng trong paper gốc (§4.1)
            api_key: ""                   # để trống, điền qua .env: OPENAI_API_KEY
            base_url: ""                  # để trống → dùng endpoint OpenAI mặc định
            temperature: 0.0

        groq-llama-3.1-8b:
            model_name: llama-3.1-8b-instant
            api_key: ""                   # điền qua .env: OPENAI_API_KEY (dùng key của Groq)
            base_url: "https://api.groq.com/openai/v1"
            temperature: 0.0
